
name: Release
on:
  push:
    tags: [ 'v*' ]


permissions:
  contents: write        # required for creating release


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      
      - name: Install GitHub CLI
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gh
 
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive TAG for this run
        id: meta
        run: |
          # If this run is on a tag push, use the tag name.
          # If it's a manual run, use the provided input or fallback to 'manual'.
          TAG="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi
          if [ -z "$TAG" ]; then TAG="manual"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using TAG=$TAG"

      - name: Build Docker image (parameterized non-root user)
        run: |
          # Match the container user to the runner's uid/gid to avoid root-owned artifacts
          UIDNUM="$(id -u)"
          GIDNUM="$(id -g)"
          echo "UID: ${UIDNUM}"

          docker build \
            --build-arg DOCKER_USER=app \
            --build-arg DOCKER_UID="${UIDNUM}" \
            --build-arg DOCKER_GID="${GIDNUM}" \
            --build-arg VER="${TAG}" \
            -t mini-sandbox:"${TAG}" \
            .

      - name: Run container (privileged) and export artifact
        run: |
          mkdir -p dist
          # Your ENTRYPOINT runs tests and copies /app/.../release -> /rel
          docker run --rm --privileged \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -e VERSION="${TAG}" \
            -v "$PWD/dist:/rel" \
            mini-sandbox:"${TAG}"

          echo "Contents of dist after container run:"
          ls -lah dist
          test -d dist/release || { echo "Expected dist/release not found"; exit 1; }


      - name: Package tarball
        run: |
          tar -C dist -czf "dist/mini-sandbox-${TAG}.tar.gz" release
          ls -lah dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum "mini-sandbox-${TAG}.tar.gz" > SHA256SUMS.txt
          ls -lah

      - name: Record build-time digest on release-checksums branch
        # Independent root of trust for prebuilt-branch.yml. The digest is written
        # here, at build time, to a separate branch that can be protected so only
        # this workflow's bot can push to it. prebuilt-branch.yml verifies the
        # downloaded tarball against THIS value, not against the checksum file
        # shipped inside the release asset — so swapping a release asset alone
        # cannot pass verification.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DIGEST="$(awk '{print $1}' dist/SHA256SUMS.txt)"
          PATH_IN_REPO="${TAG}.sha256"
          CONTENT_B64="$(printf '%s  mini-sandbox-%s.tar.gz\n' "$DIGEST" "$TAG" | base64 -w0)"

          # Ensure the orphan branch exists (create empty on first use).
          if ! gh api "repos/${REPO}/branches/release-checksums" >/dev/null 2>&1; then
            BASE_SHA="$(gh api "repos/${REPO}/git/refs/heads/${GITHUB_REF_NAME}" -q '.object.sha' 2>/dev/null || true)"
            # Fall back to default branch HEAD if the ref lookup above is unavailable.
            if [ -z "${BASE_SHA:-}" ]; then
              BASE_SHA="$(gh api "repos/${REPO}/git/refs/heads/main" -q '.object.sha')"
            fi
            gh api -X POST "repos/${REPO}/git/refs" \
              -f ref="refs/heads/release-checksums" \
              -f sha="$BASE_SHA" >/dev/null
          fi

          # A published release's digest is fixed forever. Re-recording the SAME
          # digest is allowed (so re-running the release job is safe); only a
          # DIFFERENT digest for an existing tag is rejected.
          if EXIST_B64="$(gh api "repos/${REPO}/contents/${PATH_IN_REPO}?ref=release-checksums" -q '.content' 2>/dev/null)"; then
            EXIST_DIGEST="$(printf '%s' "$EXIST_B64" | base64 -d | awk '{print $1}')"
            if [ "$EXIST_DIGEST" = "$DIGEST" ]; then
              echo "Digest for ${TAG} already recorded and matches; nothing to do."
              exit 0
            fi
            echo "::error::A DIFFERENT digest for ${TAG} is already recorded on release-checksums; refusing to overwrite."
            echo "::error::recorded=${EXIST_DIGEST} new=${DIGEST}"
            exit 1
          fi

          gh api -X PUT "repos/${REPO}/contents/${PATH_IN_REPO}" \
            -f message="Record digest for ${TAG}" \
            -f branch="release-checksums" \
            -f content="$CONTENT_B64" >/dev/null
          echo "Recorded digest for ${TAG} on release-checksums: ${DIGEST}"


      - name: Upload dist for downstream jobs
        uses: actions/upload-artifact@v7
        with:
          name: build-dist
          path: dist/
          if-no-files-found: error


      - name: Create GitHub Release and upload assets (gh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create/publish the release for the current tag and upload assets
          gh release create "${TAG}" \
            "dist/mini-sandbox-${TAG}.tar.gz" \
            "dist/SHA256SUMS.txt" \
      


  pypi_publish:
    name: Publish PyPI package (Trusted Publisher)
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive TAG for this run
        id: meta
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          if [ -z "$TAG" ]; then TAG="manual"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Using TAG=$TAG"

      - name: Download dist from previous job
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist

      - name: Build PyPI wheel builder image (Dockerfile.pypi)
        run: |
          docker build \
            -f mini_sandbox/utils/mini_sandbox_docker/Dockerfile.pypi \
            -t mini-sandbox-pypi:"${TAG}" \
            .

      - name: Run PyPI wheel builder container (dist/ -> wheel in /rel)
        run: |
          mkdir -p pypi_dist

          docker run --rm \
            -e VERSION="${TAG}" \
            -v "$PWD/pypi_dist:/rel" \
            mini-sandbox-pypi:"${TAG}"

          echo "Contents of pypi_dist:"
          ls -lah pypi_dist/
          ls -lah pypi_dist/*.whl

      - name: Publish package distributions to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi_dist
